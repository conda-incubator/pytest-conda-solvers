# disable autofixing PRs, commenting "pre-commit.ci autofix" on a pull request triggers a autofix
ci:
  autofix_prs: false
  # check-cst-schema needs the project's conda/msgspec/typer environment
  # (see environment.yml), which pre-commit.ci's isolated hook envs don't
  # provide. It still runs locally and can be added to CI separately.
  skip: [check-cst-schema]
repos:
  # generic verification and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # standard end of line/end of file cleanup
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # ensure syntaxes are valid
      - id: check-toml
      - id: check-yaml
      # catch git merge/rebase problems
      - id: check-merge-conflict
  # Python verification and formatting
  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.18.0
    hooks:
      # auto format Python codes within docstrings
      - id: blacken-docs
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      # lint & attempt to correct failures (e.g. pyupgrade)
      - id: ruff
        args: [--fix]
      # compatible replacement for black
      - id: ruff-format
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.14.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --trailing-commas, --no-sort]
  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        # ruamel.yaml doesn't line wrap correctly (?) so set width to 1M to avoid issues
        args: [--mapping=2, --offset=2, --sequence=4, --width=1000000, --implicit_start]
  - repo: meta
    # see https://pre-commit.com/#meta-hooks
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # project-specific checks that need the pixi-managed dev environment
  - repo: local
    hooks:
      - id: check-cst-schema
        name: check docs/cst_schema.json is up to date
        description: >-
          Regenerates the JSON schema for TestModule and fails if
          docs/cst_schema.json is stale relative to models.py. Run `pixi run
          generate-schema` to update the file, then commit the change.
        # Invoked via `pixi run` (rather than calling python directly) so the
        # check resolves the project's pixi environment on its own, even if
        # the shell running `git commit` doesn't have it activated.
        entry: pixi run check-schema
        language: system
        files: ^(pytest_conda_solvers/(models|cli)\.py|docs/cst_schema\.json)$
        pass_filenames: false
