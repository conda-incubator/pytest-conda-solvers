name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.solver }} solver
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        solver: [classic, libmamba]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.65.0
          cache: true
          activate-environment: true

      - name: Run tests for ${{ matrix.solver }}
        run: pixi run test-$MATRIX_SOLVER-solver -vv
        shell: bash
        env:
          MATRIX_SOLVER: ${{ matrix.solver }}

  test-python-minimum:
    name: Test on minimum supported Python (currently 3.10) / ${{ matrix.solver }} solver
    strategy:
      fail-fast: false
      matrix:
        solver: [classic, libmamba]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          pixi-version: v0.65.0
          run-install: false

      - name: Run tests on minimum supported Python
        shell: bash
        env:
          MATRIX_SOLVER: ${{ matrix.solver }}
        run: |
          pixi exec \
            --spec "python=3.10" \
            --spec "conda>=26.3.0" \
            --spec "conda-libmamba-solver>=26.4.0" \
            --spec boltons \
            --spec fastapi \
            --spec fastapi-cache2 \
            --spec hatch-vcs \
            --spec hatchling \
            --spec msgspec \
            --spec pip \
            --spec pytest \
            --spec typer \
            bash -c '
              python -m pip install --no-deps --no-build-isolation . &&
              python -m pytest \
                --conda-solver="$MATRIX_SOLVER" \
                tests/test_provenance.py \
                -vv
            '

  analyze:
    name: Aggregate
    needs: [test, test-python-minimum]
    if: '!cancelled()'
    runs-on: ubuntu-slim
    steps:
      - name: Determine Success
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
