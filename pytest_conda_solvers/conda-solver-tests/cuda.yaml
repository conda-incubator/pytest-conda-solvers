tests:
  - name: test_cuda_1
    id: C001
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_1
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L254-L263
    kind: solve
    description: |
      With the __cuda virtual package set to 9.2, cudatoolkit resolves to the
      newest build the driver allows. The channel ships only cudatoolkit 9.0
      (needing __cuda >=9.0) and 10.0 (needing __cuda >=10.0), and there is no
      9.2 build, so the 10.0 build is excluded and 9.0 is selected, matching
      upstream's assertion.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '9.2'
    output:
      final_state:
        - channel-1/${{ arch }}::cudatoolkit-9.0-0

  - name: test_cuda_2
    id: C002
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_2
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L266-L275
    kind: solve
    description: |
      A newer __cuda driver of 10.0 lets cudatoolkit resolve to its 10.0 build.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '10.0'
    output:
      final_state:
        - channel-1/${{ arch }}::cudatoolkit-10.0-0

  - name: test_cuda_fail_1
    id: C003
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_1
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L278-L317
    kind: unsatisfiable
    description: |
      An old __cuda driver of 8.0 is too low for any cudatoolkit build, so the
      solve is unsatisfiable. Upstream asserts a solver-specific message for
      each backend (classic, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L309-L317
      libmamba, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L289-L302
      and rattler, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L303-L308),
      carried here as a solver-keyed message_includes mapping. The feature
      line naming the __cuda record in classic's message is platform
      dependent, so it is not asserted. For libmamba upstream accepts either
      of two equivalent problem messages, one per cudatoolkit build, an
      alternative the harness cannot express, so the libmamba key pins the
      first variant, which is what libmamba produces here.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: '8.0'
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        classic:
          - The following specifications were found to be incompatible with your system
          - cudatoolkit -> __cuda[version='>=10.0|>=9.0']
          - 'Your installed version is: 8.0'
        libmamba:
          - |-
            Encountered problems while solving:
              - nothing provides __cuda >=9.0 needed by cudatoolkit-9.0-0
        rattler:
          - "__cuda >=9.0, for which no candidates were found."
          - "cudatoolkit * cannot be installed because there are no viable options:"

  - name: test_cuda_fail_2
    id: C004
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_fail_2
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L320-L359
    kind: unsatisfiable
    description: |
      With no __cuda driver present at all, cudatoolkit cannot be installed and
      the solve is unsatisfiable. Upstream asserts a solver-specific message
      for each backend (classic, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L352-L359
      libmamba, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L332-L345
      and rattler, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L346-L351),
      carried here as a solver-keyed message_includes mapping. For libmamba
      upstream accepts either of two equivalent problem messages, one per
      cudatoolkit build, an alternative the harness cannot express, so the
      libmamba key pins the first variant, which is what libmamba produces
      here.
    input:
      channels: channel-1
      specs_to_add: cudatoolkit
      override_cuda: ''
    error:
      exception: UnsatisfiableError
      entries: []
      message_includes:
        classic:
          - The following specifications were found to be incompatible with your system
          - cudatoolkit -> __cuda[version='>=10.0|>=9.0']
          - 'Your installed version is: not available'
        libmamba:
          - |-
            Encountered problems while solving:
              - nothing provides __cuda >=9.0 needed by cudatoolkit-9.0-0
        rattler:
          - "cudatoolkit * cannot be installed because there are no viable options:"
          - "__cuda >=9.0, for which no candidates were found."

  - name: test_cuda_constrain_absent
    id: C005
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_constrain_absent
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L362-L371
    kind: solve
    description: |
      A package that only constrains __cuda (rather than depending on it) still
      installs when no cuda driver is present.
    input:
      channels: channel-1
      specs_to_add: cuda-constrain
      override_cuda: ''
    output:
      final_state:
        - channel-1/${{ arch }}::cuda-constrain-11.0-0

  - name: test_cuda_glibc_sat
    id: C006
    provenance:
      node_id: tests/core/test_solve.py::test_cuda_glibc_sat
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L409-L419
    kind: solve
    description: |
      A package that depends on the __cuda virtual package and constrains
      __glibc installs when the driver and glibc overrides satisfy both.
      Upstream restricts this test to Linux because the __glibc virtual
      package is only generated there, see
      https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L408
      On non-Linux hosts the glibc override is inert and the constraint is not
      exercised, but cuda-glibc still installs because its __glibc entry is
      only a constrains, so the test passes everywhere.
    input:
      channels: channel-1
      specs_to_add: cuda-glibc
      override_cuda: '10.0'
      override_glibc: '2.23'
    output:
      final_state:
        - channel-1/${{ arch }}::cuda-glibc-10.0-0

  - name: test_solve_msgs_exclude_vp
    id: C007
    provenance:
      node_id: tests/core/test_solve.py::test_solve_msgs_exclude_vp
      commit: 68e257311038f6b6599c0241d929f95a3b1da03c
      url: https://github.com/conda/conda/blob/68e257311038f6b6599c0241d929f95a3b1da03c/tests/core/test_solve.py#L238-L251
    kind: unsatisfiable
    description: |
      python=2.7.5 conflicts with readline=5.0, so the solve fails. The solver
      hint must not mention the __cuda virtual package, which is not a
      dependency of anything requested.
    input:
      channels: channel-1
      specs_to_add:
        - python =2.7.5
        - readline =5.0
      override_cuda: '10.0'
    error:
      exception: UnsatisfiableError
      entries: []
      message_excludes: __cuda==10.0
