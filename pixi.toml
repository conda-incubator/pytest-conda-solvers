[dependencies]
conda = ">=26.3.0"
conda-libmamba-solver = ">=26.4.0"
fastapi = "*"
fastapi-cache2 = "*"
msgspec = "*"
pytest = ">=6.2.0"
python = ">=3.12"
typer = ">=0.15.1,<0.16"

[pypi-dependencies]
pytest-conda-solvers = {path = ".", editable = true}

[tasks]
generate-schema = "python -m pytest_conda_solvers.cli"
test-classic-solver = "pytest --conda-solver=classic conda-solver-tests tests/test_provenance.py"
test-libmamba-solver = "pytest --conda-solver=libmamba conda-solver-tests tests/test_provenance.py"

[feature.provenance.dependencies]
python = "~=3.13.0"
httpx = "*"

[feature.provenance.tasks]
update-provenance = "python tools/update_provenance.py"

[environments]
provenance = { features = ["provenance"], no-default-feature = true }

[workspace]
authors = ["conda contributors"]
channels = ["conda-forge"]
description = "A pytest plugin to run conda solver tests"
license = "BSD-3-Clause"
license-file = "LICENSE"
name = "pytest-conda-solvers"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
readme = "README.md"
